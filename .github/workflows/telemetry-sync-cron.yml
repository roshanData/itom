name: ITOM Telemetry 30-Min Auto-Sync

on:
  schedule:
    # Runs every 30 minutes (:00 and :30 of every hour)
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  sync-telemetry:
    name: Sync Live Telemetry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install requests python-dotenv urllib3

      - name: Run 30-Minute Telemetry Extraction & Processing
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SOLARWINDS_HOST: ${{ secrets.SOLARWINDS_HOST }}
          SOLARWINDS_PORT: ${{ secrets.SOLARWINDS_PORT }}
          SOLARWINDS_USERNAME: ${{ secrets.SOLARWINDS_USERNAME }}
          SOLARWINDS_PASSWORD: ${{ secrets.SOLARWINDS_PASSWORD }}
        run: python scripts/run_sync.py --skip-firestore || true

      - name: Validate Mathematical Invariants
        run: |
          python tests/verify_intune_data.py
          python tests/verify_solarwinds_data.py
