name: "Microsoft Intune Telemetry Sync Pipeline"

on:
  schedule:
    # Run weekly at 02:00 UTC on Mondays
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      force_live_fetch:
        description: "Force live Graph API ingestion (requires Azure AD secrets)"
        required: false
        default: false
        type: boolean
      skip_firestore:
        description: "Skip Firestore cloud persistence step"
        required: false
        default: false
        type: boolean

concurrency:
  group: intune-telemetry-sync
  cancel-in-progress: true

jobs:
  telemetry-sync-and-verify:
    name: "Sync, Invariant Audit & Deploy"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Set up Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            **/requirements.txt
            **/pyproject.toml

      - name: "Install Python Dependencies"
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Install optional cloud SDKs if configured
          pip install --quiet google-cloud-firestore || true

      - name: "Execute Automated Telemetry Sync Pipeline"
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}
        run: |
          FLAGS=""
          if [ "${{ inputs.force_live_fetch }}" = "true" ]; then
            FLAGS="$FLAGS --fetch-live"
          else
            FLAGS="$FLAGS --skip-fetch"
          fi
          if [ "${{ inputs.skip_firestore }}" = "true" ]; then
            FLAGS="$FLAGS --skip-firestore"
          fi
          
          echo "Executing: python scripts/run_sync.py $FLAGS"
          python scripts/run_sync.py $FLAGS

      - name: "Assert Mathematical Invariants (25,987 Endpoints)"
        run: |
          echo "Running Multi-Agent Data Invariant Gate..."
          python tests/verify_intune_data.py

      - name: "Run Complete E2E Test Suite (Tiers 1-4)"
        run: |
          echo "Running Master E2E Verification Suites..."
          python tests/run_e2e_tests.py --verbose

      - name: "Commit and Push Updated Summary Payload (if changed)"
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [Telemetry Sync]"
          git add data/intune_summary.json
          if git diff --staged --quiet; then
            echo "No changes detected in intune_summary.json payload."
          else
            git commit -m "chore(sync): automated weekly Intune telemetry refresh [skip ci]"
            git push
          fi
